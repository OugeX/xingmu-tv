<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif;color:#fff}
.video{position:absolute;inset:0;overflow:hidden}
.video img{width:100%;height:100%;object-fit:cover;filter:brightness(.72) saturate(1.05)}
.hud{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.82) 100%)}
.top{position:absolute;left:72px;top:52px;right:72px;display:flex;align-items:center;gap:20px}
.title{font-size:38px;font-weight:800}
.epi{font-size:22px;color:#cfc7bd}
.src{margin-left:auto;font-size:17px;color:#cfc7bd;border:1px solid rgba(255,255,255,.28);padding:7px 14px;border-radius:4px}
.center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;gap:64px;align-items:center}
.big{width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.big.main{width:130px;height:130px;background:rgba(232,184,114,.92);border-color:#E8B872;color:#1a1206;font-size:44px;box-shadow:0 0 60px rgba(232,184,114,.45)}
.bottom{position:absolute;left:72px;right:72px;bottom:56px}
.bar{height:6px;background:rgba(255,255,255,.22);border-radius:3px;position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:42%;background:#E8B872;border-radius:3px}
.bar .dot{position:absolute;left:42%;top:-7px;width:20px;height:20px;border-radius:50%;background:#E8B872;box-shadow:0 0 0 6px rgba(232,184,114,.25)}
.times{display:flex;justify-content:space-between;font-size:17px;color:#cfc7bd;margin-top:10px}
.ctrl{display:flex;align-items:center;gap:14px;margin-top:22px;font-size:19px}
.pill{padding:11px 22px;border:1px solid rgba(255,255,255,.26);border-radius:6px;background:rgba(255,255,255,.08)}
.pill.on{border-color:#E8B872;color:#E8B872;background:rgba(232,184,114,.14)}
.pill .k{font-size:13px;color:#8d857c;margin-left:8px}
.spacer{flex:1}
.info{font-size:15px;color:#a89f95}
</style></head><body>
<div class="video"><img src="posters/p4.webp"></div>
<div class="hud">
  <div class="top">
    <div class="title">恐惧回响</div><div class="epi">第 1 集 / 共 8 集</div>
    <div class="src">暴风源 · 1080p · 硬解 H.264</div>
  </div>
  <div class="center">
    <div class="big">⏪</div>
    <div class="big main">⏸</div>
    <div class="big">⏩</div>
  </div>
  <div class="bottom">
    <div class="bar"><div class="fill"></div><div class="dot"></div></div>
    <div class="times"><span>00:12:38</span><span>— 02:06:44</span></div>
    <div class="ctrl">
      <div class="pill on">▶ 继续播放</div>
      <div class="pill">倍速 1.0×<span class="k">▶</span></div>
      <div class="pill">画面 适应</div>
      <div class="pill">选集</div>
      <div class="pill">切源 3</div>
      <div class="spacer"></div>
      <div class="info">硬解 H.264 · 1080p · 6.0Mbps · 缓存 12MB</div>
    </div>
  </div>
</div>
</body></html>
