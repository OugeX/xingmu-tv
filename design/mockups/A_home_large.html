<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
/* 大字号模式（1.3×，4 列）：与标准档同一套令牌，字号/密度/对比度/焦点一起变 */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif;color:#fff}
.hero{display:none;position:relative;height:455px;overflow:hidden}
.hero img{position:absolute;right:0;top:-60px;height:640px;width:1120px;object-fit:cover;opacity:.5}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 16%,rgba(0,0,0,.88) 44%,rgba(0,0,0,.5) 70%,#000 100%),linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,0) 40%,#000 94%)}
.badge{position:absolute;left:180px;top:48px;font-size:20px;letter-spacing:4px;color:#E8B872;border:2px solid rgba(232,184,114,.7);padding:8px 16px;border-radius:4px}
.htxt{position:absolute;left:180px;top:106px;z-index:2}
.htxt h1{font-size:96px;font-weight:800;letter-spacing:2px}
.meta{margin-top:20px;display:flex;gap:16px;align-items:center;font-size:26px;color:#d8d0c7}
.score{color:#E8B872;font-weight:800;font-size:34px}
.desc{margin-top:16px;font-size:24px;line-height:1.55;color:#e6ded4;width:900px}
.btns{margin-top:20px;display:flex;gap:18px}
.btn{padding:20px 46px;border-radius:8px;font-size:28px;font-weight:800;min-height:72px;display:flex;align-items:center}
.btn.p{background:#E8B872;color:#1a1206;box-shadow:0 10px 36px rgba(232,184,114,.4)}
.btn.s{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4)}
.rail{position:fixed;left:0;top:0;width:160px;height:1080px;background:#000;border-right:2px solid #2a2a2e;display:flex;flex-direction:column;align-items:center;padding-top:40px;gap:26px;z-index:9}
.logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(140deg,#E8B872,#8a5a1e);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#1a1206;margin-bottom:8px}
.nav{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.55}
.nav.on{opacity:1}
.nav .ico{width:56px;height:56px;border:2px solid currentColor;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.nav.on .ico{border-color:#E8B872;color:#E8B872;background:rgba(232,184,114,.16)}
.nav span{font-size:19px;color:#fff}
.rows{position:absolute;left:180px;top:104px;width:1690px}
.rowhead{display:flex;align-items:baseline;gap:16px;margin:8px 0 14px}
.rowhead h2{font-size:38px}
.rowhead em{font-size:20px;color:#B8B0A6;font-style:normal}
.rowhead .more{margin-left:auto;font-size:22px;color:#cfc7bd}
.posters{display:flex;gap:22px}
.p{width:346px}
.p .im{width:346px;height:462px;border-radius:10px;object-fit:cover;display:block;background:#151515;border:2px solid #2a2a2e}
.p .nm{margin-top:12px;font-size:28px;line-height:1.22;color:#fff;max-height:70px;overflow:hidden}
.p .ep{font-size:22px;color:#B8B0A6;margin-top:6px}
.focus{outline:5px solid #E8B872;outline-offset:6px;border-radius:12px;box-shadow:0 0 0 12px rgba(232,184,114,.18),0 20px 60px rgba(232,184,114,.35)}
.tag{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.8);color:#E8B872;font-size:20px;padding:5px 10px;border-radius:5px;border:1px solid rgba(232,184,114,.5)}
.mode{position:absolute;left:180px;bottom:12px;font-size:20px;color:#E8B872;border:2px solid rgba(232,184,114,.5);padding:8px 16px;border-radius:6px}
</style></head><body>
<div class="rail">
  <div class="logo">幕</div>
  <div class="nav on"><div class="ico">首</div><span>推荐</span></div>
  <div class="nav"><div class="ico">影</div><span>电影</span></div>
  <div class="nav"><div class="ico">剧</div><span>剧集</span></div>
  <div class="nav"><div class="ico">漫</div><span>动漫</span></div>
  <div class="nav"><div class="ico">综</div><span>综艺</span></div>
  <div class="nav"><div class="ico">外</div><span>海外</span></div>
  <div class="nav"><div class="ico">直</div><span>直播</span></div>
</div>
<div class="hero">
  <img src="posters/p5.webp">
  <div class="badge">正在热播</div>
  <div class="htxt">
    <h1>新斯坦福监狱实验</h1>
    <div class="meta"><span class="score">8.9</span><span>2026</span><span>欧美剧</span><span>更新至 08 集</span></div>
    <div class="desc">一个数字创作者发现了一卷被封存半个世纪的诅咒胶片，当他把它上传给观众，猎杀就开始了。</div>
    <div class="btns"><div class="btn p">▶ 立即播放</div><div class="btn s">＋ 收藏</div></div>
  </div>
</div>
<div class="head" style="position:absolute;left:180px;top:34px;display:flex;align-items:baseline;gap:20px">
  <span style="font-size:34px;font-weight:800;color:#E8B872">星幕</span>
  <span style="font-size:22px;color:#B8B0A6">推荐 · 大字号模式（Hero 收起，一屏 4 张卡，字大不挤）</span>
</div>
<div class="rows">
  <div class="rowhead"><h2>最新更新</h2><em>大字号模式 · 4 列</em><div class="more">更多 ›</div></div>
  <div class="posters">
    <div class="p focus"><div style="position:relative"><img class="im" src="posters/p1.webp"><div class="tag">10-21</div></div><div class="nm">小城良方</div><div class="ep">国产剧</div></div>
    <div class="p"><div style="position:relative"><img class="im" src="posters/p2.jpg"><div class="tag">10-21</div></div><div class="nm">暖暖的味道</div><div class="ep">大陆综艺</div></div>
    <div class="p"><div style="position:relative"><img class="im" src="posters/p4.webp"><div class="tag">HD</div></div><div class="nm">恐惧回响</div><div class="ep">恐怖片 · 2026</div></div>
    <div class="p"><div style="position:relative"><img class="im" src="posters/p5.webp"><div class="tag">更新08</div></div><div class="nm">新斯坦福监狱实验</div><div class="ep">欧美剧 · 悬疑</div></div>
  </div>
</div>
<div class="mode">显示：大字号 1.3× · 4 列 · 高对比 · 焦点加粗</div>
</body></html>
