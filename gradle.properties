# 构建内存与编码（Windows 中文路径 + Kotlin/Compose 编译）
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX / Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.5.2 官方最高校验到 API 34；Media3 1.5.1 的 aar-metadata 要求 minCompileSdk=35，
# 因此 compileSdk=35（targetSdk 仍为 34）。该开关只抑制“AGP 版本较旧”的警告，不改变产物行为。
android.suppressUnsupportedCompileSdk=35
